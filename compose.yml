# The data-handyman stack: run the whole app with one command.
#
# Two services (frontend, backend) started together under one project
# name, so the data volume and container names stay fixed across
# rebuilds and re-clones (the project name, not the folder name, decides
# them, which is why `name:` below is pinned rather than left to default).
#
# Only the frontend is reachable from outside the container network, on
# 127.0.0.1 (this machine only) so the app isn't exposed on the network.
# It proxies API calls to the backend itself; the backend has no
# published port.
#
# Start:   podman compose up -d --build
# Stop:    podman compose down
# Update:  re-run `podman compose up -d --build` after pulling new code
#
# Never run `podman compose down -v` — that deletes the data volume,
# and with it every template and record.
#
# Known environment issue (not caused by this project): on some podman
# setups, the commit/tag step of `podman build` (including the one
# `podman compose up --build` runs internally) can be rejected by an
# image-signing policy — "Source image rejected ... by policy" — even for
# a brand-new, never-before-used tag. If that happens, build each image
# directly first (`podman build -t data-handyman-backend -f
# Containerfile.backend .` / `-t data-handyman-frontend -f
# Containerfile.frontend .`), which may hit the same error but often
# still leaves a usable tagged image behind; then run `podman compose up
# -d` WITHOUT `--build` so compose just runs the already-built images.

name: data-handyman

services:
  backend:
    build:
      context: .
      dockerfile: Containerfile.backend
    volumes:
      - data-handyman-data:/data
    environment:
      - DB_PATH=/data/handy_recorder.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Containerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data-handyman-data:
