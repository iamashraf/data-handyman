server {
    listen 80;

    # Excel file uploads (/templates/from-excel, /templates/{id}/import) are
    # larger than nginx's 1MB default.
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    location /templates {
        proxy_pass http://backend:8000;
    }

    location /records {
        proxy_pass http://backend:8000;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
