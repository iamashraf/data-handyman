# Local exploration stack for Handy Recorder.
#
# SQLite is not a separate service: the database is a single file inside
# the backend's bind-mounted volume, so it already persists across
# container restarts without any extra service here.
#
# The backend initializes its schema itself on startup (see app/main.py),
# so no manual init step is needed here.
#
# Run:    podman compose up --build
# Stop:   podman compose down
#
# Known environment issue (not caused by this project): on some podman
# setups, the commit/tag step of `podman build` (including the one
# `podman compose up --build` runs internally) can be rejected by an
# image-signing policy — "Source image rejected ... by policy" — even for
# a brand-new, never-before-used tag. If that happens, build each image
# directly first (`podman build -t handy-recorder-backend -f
# Containerfile.dev .` / `-t handy-recorder-frontend -f
# Containerfile.frontend-dev .`), which may hit the same error but often
# still leaves a usable tagged image behind; then run `podman compose up`
# WITHOUT `--build` so compose just runs the already-built images.

services:
  backend:
    build:
      context: .
      dockerfile: Containerfile.dev
    volumes:
      - ./backend:/app
    working_dir: /app
    ports:
      - "8010:8000"
    environment:
      - DB_PATH=/app/handy_recorder.db

  frontend:
    build:
      context: .
      dockerfile: Containerfile.frontend-dev
    volumes:
      - ./frontend:/app
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_DEV_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
